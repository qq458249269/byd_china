name: Release on master push

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    name: Package and pre-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read manifest version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/byd_china/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "manifest version $VERSION"

      - name: Check tag does not already exist
        id: check_tag
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Package component
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          find custom_components/byd_china -name "__pycache__" -type d -prune -exec rm -rf {} +
          find custom_components/byd_china -name "*.pyc" -delete
          cd custom_components
          zip -r ../byd_china.zip byd_china

      - name: Create pre-release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: byd_china.zip
